<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIND PRO — New Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#151518;--line:#26262b;--tx:#f4f4f5;--mu:#9a9aa3;--ac:#c6ff3d;--ac2:#0b0b0d;--hd:rgba(11,11,13,.85);--in:#0f0f12;--hero:#1d2a05;--ph:#1c1c20}
:root[data-theme="light"]{--bg:#f6f6f3;--card:#ffffff;--line:#e2e2dc;--tx:#111114;--mu:#63636b;--ac:#3f8f00;--ac2:#ffffff;--hd:rgba(246,246,243,.88);--in:#f0f0ec;--hero:#dff2b8;--ph:#ececE6}
.tg{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;margin-right:8px}
.hr{display:flex;align-items:center}
.ico{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.tg,.cartbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tg .ico{width:20px;height:20px}
.perks div{display:flex;align-items:center;gap:8px}
.perks .ico{color:var(--ac);width:18px;height:18px}
.x .ico{width:22px;height:22px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px}
.logo b{color:var(--ac)}
.cartbtn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.cartbtn span{background:var(--ac);color:var(--ac2);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:13px}
.hero{padding:9vw 5vw 6vw;text-align:center;background:radial-gradient(circle at 50% 0,var(--hero),transparent 60%)}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,12vw,130px);line-height:.95;letter-spacing:2px}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{color:var(--mu);margin:16px 0 28px;font-size:18px}
.btn{display:inline-block;background:var(--ac);color:var(--ac2);border:0;border-radius:12px;padding:14px 28px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;width:auto}
.btn:hover{filter:brightness(1.08)}
.btn.full{width:100%}
.perks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 5vw 40px;color:var(--mu);font-size:14px}
.perks div{border:1px solid var(--line);border-radius:999px;padding:8px 16px}
h2{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;padding:0 5vw 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:0 5vw 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--ph)}
.card .in{padding:14px 16px 18px}
.card h3{font-size:16px;font-weight:600}
.price{color:var(--ac);font-weight:800;margin-top:4px}
footer{border-top:1px solid var(--line);padding:30px 5vw;text-align:center;color:var(--mu);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:22px;position:relative}
.x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--mu);font-size:26px;cursor:pointer}
.box img.big{width:100%;border-radius:14px;margin-bottom:14px;max-height:340px;object-fit:cover}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:flex;gap:10px}.row>*{flex:1}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.sizes button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.line small{color:var(--mu);display:block}
.line button{background:none;border:0;color:#ff6b6b;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:16px 0}
.msg{color:#ff6b6b;font-size:14px;margin-top:10px;display:none}
.ok{text-align:center;padding:20px 0}.ok h3{font-size:24px;margin:10px 0}
</style>
<script>
(function(){var t=null;try{t=localStorage.getItem("gp_theme")}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
document.documentElement.setAttribute("data-theme",t)})();
</script>
</head>
<body>
<header>
  <div class="logo">GRIND<b> PRO</b></div>
  <div class="hr"><button class="tg" id="tg" onclick="toggleTheme()" aria-label="Thème"></button><button class="cartbtn" onclick="openCart()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Panier <span id="cnt">0</span></button></div>
</header>

<section class="hero">
  <h1>NEW <em>COLLECTION</em></h1>
  <p>Quality streetwear. Fast shipping.</p>
  <a class="btn" href="#shop">Voir la collection</a>
</section>
<div class="perks"><div><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg> Livraison 58 wilayas</div><div><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg> Paiement à la livraison</div><div><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg> Qualité garantie</div></div>

<h2 id="shop">COLLECTION</h2>
<div class="grid" id="grid"></div>

<footer>© GRIND PRO — Commandez en 1 minute, on vous appelle pour confirmer.</footer>

<!-- Product modal -->
<div class="ov" id="pm"><div class="box" id="pbox"></div></div>
<!-- Cart modal -->
<div class="ov" id="cm"><div class="box">
  <button class="x" onclick="closeAll()" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <h3 style="margin-bottom:8px">Votre panier</h3>
  <div id="clines"></div>
  <div class="tot"><span>Total</span><span id="ctot">0 DA</span></div>
  <button class="btn full" id="gocheck" onclick="openCheckout()">Commander</button>
</div></div>
<!-- Checkout modal -->
<div class="ov" id="km"><div class="box" id="kbox">
  <button class="x" onclick="closeAll()" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <h3>Vos informations</h3>
  <form id="f" onsubmit="send(event)">
    <label>Nom complet</label><input name="Nom" required>
    <label>Téléphone</label><input name="Telephone" type="tel" required placeholder="05 / 06 / 07 ...">
    <div class="row">
      <div><label>Wilaya</label><input name="Wilaya" required placeholder="ex: Alger"></div>
      <div><label>Commune</label><input name="Commune" required></div>
    </div>
    <label>Adresse de livraison</label><textarea name="Adresse" rows="2" required></textarea>
    <div class="tot"><span>Total</span><span id="ktot"></span></div>
    <button class="btn full" id="sb" type="submit">Confirmer la commande</button>
    <div class="msg" id="err"></div>
  </form>
</div></div>

<script>
const EMAIL = "adlnmhd2002@gmail.com";
const MOON = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`, SUN = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
const setTg = () => { $("tg").innerHTML = document.documentElement.getAttribute("data-theme") === "dark" ? MOON : SUN; };
// ===== IMAGES: change a link here if a picture does not show =====
const G = "https://github.com/grind-pro-store/site/blob/main/";
const R = "https://raw.githubusercontent.com/grind-pro-store/site/main/";
let P = [
 {id:1,n:"Pack demi veste + baggy",p:3200,i:G+"pack%20demi%20vest%2Bbaggy.PNG?raw=true"},
 {id:2,n:"Pack demi veste + jogging",p:3200,i:G+"pack%20demi%20vest%2Bjogging.PNG?raw=true"},
 {id:3,n:"Pack tricot + baggy",p:2800,i:G+"pack%20tricot%20sport%2Bbaggy.PNG?raw=true"},
 {id:4,n:"Pack tricot + jogging",p:2800,i:G+"pack%20tricot%20sport%2Bjogging.PNG?raw=true"},
 {id:5,n:"Tricot simple demi manche",p:1200,i:R+"tricot%20n.png"},
 {id:6,n:"Tricot avec logo demi manche",p:1400,i:R+"tricot%20logo%20n.png"},
 {id:7,n:"Demi veste",p:1400,i:G+"demivest%20index.png?raw=true"},
 {id:8,n:"Baggy Nike",p:2000,i:G+"baggy%20index.png?raw=true"},
 {id:9,n:"Jogging Nike",p:2000,i:G+"jogging%20index.png?raw=true"}
];
const SIZES = ["S","M","L","XL","XXL"];
let cart = [];
try { cart = JSON.parse(localStorage.getItem("gp_cart") || "[]"); } catch(e) {}
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("fr-FR") + " DA";
const save = () => { try { localStorage.setItem("gp_cart", JSON.stringify(cart)); } catch(e) {} $("cnt").textContent = cart.reduce((a,c)=>a+c.q,0); };
const total = () => cart.reduce((a,c)=>a+c.p*c.q,0);

function renderGrid(){ $("grid").innerHTML = P.length ? P.map(p => `<div class="card" onclick="openProd(${p.id})"><img loading="lazy" src="${p.i}" alt="${p.n}" data-id="${p.id}" onerror="imgFail(this)"><div class="in"><h3>${p.n}</h3><div class="price">${fmt(p.p)}</div></div></div>`).join("") : '<p style="color:var(--mu)">Bientôt de nouveaux articles.</p>'; }
renderGrid();
// Owner adds items in admin.html -> saved in products.json -> shown here
fetch("products.json?v=" + Date.now()).then(r => r.ok ? r.json() : Promise.reject()).then(d => { if (Array.isArray(d) && d.length) { P = d; renderGrid(); } }).catch(() => {});

// Fallback: try other versions of the same link, then a placeholder
function imgFail(el){
  const p = P.find(x => x.id == el.dataset.id), step = +(el.dataset.step || 0);
  const u = p.i, file = decodeURIComponent(u.split("/").pop().split("?")[0]);
  const alts = [
    u.replace("github.com/","raw.githubusercontent.com/").replace("/blob/","/").replace("?raw=true",""),
    "images/" + file,
    "https://cdn.jsdelivr.net/gh/grind-pro-store/site@main/" + file
  ];
  if (step < alts.length) { el.dataset.step = step + 1; el.src = alts[step]; return; }
  el.onerror = null;
  el.src = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="#888" fill-opacity=".25"/><text x="300" y="310" font-family="sans-serif" font-size="34" fill="#888" text-anchor="middle">GRIND PRO</text></svg>');
}
function toggleTheme(){
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("gp_theme", t); } catch(e) {}
  setTg();
}
function closeAll(){ document.querySelectorAll(".ov").forEach(o => o.classList.remove("on")); }
document.querySelectorAll(".ov").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeAll(); }));

let sel = {id:0, size:"M"};
function openProd(id){
  const p = P.find(x => x.id === id); const SZ = p.sz && p.sz.length ? p.sz : SIZES; sel = {id, size:SZ[0]};
  $("pbox").innerHTML = `<button class="x" onclick="closeAll()" aria-label="Fermer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <img class="big" src="${p.i}" alt="${p.n}" data-id="${p.id}" onerror="imgFail(this)"><h3>${p.n}</h3><div class="price" style="font-size:20px">${fmt(p.p)}</div>
    <label>Taille</label><div class="sizes">${SZ.map((s,k)=>`<button class="${k===0?"on":""}" onclick="pickSize(this,'${s}')">${s}</button>`).join("")}</div>
    <label>Quantité</label><input id="qty" type="number" min="1" value="1">
    <button class="btn full" style="margin-top:18px" onclick="addCart()">Ajouter au panier</button>`;
  closeAll(); $("pm").classList.add("on");
}
function pickSize(b, s){ sel.size = s; b.parentNode.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); }
function addCart(){
  const p = P.find(x => x.id === sel.id), q = Math.max(1, +$("qty").value || 1);
  const ex = cart.find(c => c.id === p.id && c.s === sel.size);
  if (ex) ex.q += q; else cart.push({id:p.id, n:p.n, p:p.p, s:sel.size, q});
  save(); openCart();
}
function openCart(){
  closeAll();
  $("clines").innerHTML = cart.length ? cart.map((c,i) => `<div class="line"><div>${c.n}<small>Taille ${c.s} · ${c.q} × ${fmt(c.p)}</small></div><div>${fmt(c.p*c.q)}<br><button onclick="rm(${i})">Retirer</button></div></div>`).join("") : '<p style="color:var(--mu);padding:14px 0">Votre panier est vide.</p>';
  $("ctot").textContent = fmt(total());
  $("gocheck").style.display = cart.length ? "block" : "none";
  $("cm").classList.add("on");
}
function rm(i){ cart.splice(i,1); save(); openCart(); }
function openCheckout(){ closeAll(); $("ktot").textContent = fmt(total()); $("km").classList.add("on"); }

async function send(e){
  e.preventDefault();
  const btn = $("sb"), err = $("err"); err.style.display = "none";
  btn.disabled = true; btn.textContent = "Envoi en cours...";
  const d = Object.fromEntries(new FormData($("f")).entries());
  d.Commande = cart.map(c => `${c.n} | Taille ${c.s} | x${c.q} | ${c.p*c.q} DA`).join("\n");
  d.Total = fmt(total());
  d._subject = "Nouvelle commande GRIND PRO — " + d.Nom;
  d._template = "table"; d._captcha = "false";
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + EMAIL, {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(d)
    });
    const j = await r.json();
    if (!r.ok || j.success === "false") throw new Error(j.message || "Erreur");
    cart = []; save();
    $("kbox").innerHTML = `<div class="ok"><div style="font-size:64px;color:var(--ac)"><svg class="ico" style="width:1em;height:1em" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div><h3>Merci ${d.Nom} !</h3><p style="color:var(--mu)">Votre commande est bien reçue. Nous vous appellerons très bientôt pour la confirmer.</p><button class="btn" style="margin-top:20px" onclick="location.reload()">Retour à la boutique</button></div>`;
  } catch(x) {
    err.textContent = "Échec de l'envoi. Vérifiez votre connexion et réessayez.";
    err.style.display = "block"; btn.disabled = false; btn.textContent = "Confirmer la commande";
  }
}
setTg();
save();
</script>
</body>
</html>
